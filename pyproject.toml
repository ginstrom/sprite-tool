[project]
name = "sprite-tool"
version = "0.2.0"
description = "Agent-friendly command-line tool for making 2D pixel sprites from text definitions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3,<12.4",
]

[project.scripts]
sprite = "sprite_tool.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprite_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
